[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Только правила, которые ловят падения в рантайме (синтаксис, неопределённые имена,
# сравнение с None через ==). Стилевые наборы здесь не включаем: в проекте 60+
# исследовательских скриптов, и косметические замечания по ним только шумят в CI.
select = ["E9", "F63", "F7", "F82"]
